name: Integración Continua (CI)

on:
  push:
    branches: [ "tp3","main"]
  pull_request:
    branches: [ "tp3","main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar el código
      uses: actions/checkout@v3

    - name: Configurar Java 21
      uses: actions/setup-java@v3
      with:
        java-version: '21' 
        distribution: 'temurin'
        cache: maven

    - name: Dar permisos de ejecución a Maven Wrapper
      run: chmod +x mvnw

    - name: Ejecutar Tests
      run: ./mvnw clean test

    - name: 1 · Compilar el proyecto y las pruebas
      run: ./mvnw --batch-mode test-compile
    
    - name: 2 · Pruebas unitarias
      run: ./mvnw --batch-mode test

    - name: 3 · Pruebas de integración y cobertura
      run: ./mvnw --batch-mode verify

    - name: Guardar el reporte de cobertura
      if: always()
      uses: actions/upload-artifact@v4
      with:
          name: reporte-de-cobertura
          path: target/site/jacoco