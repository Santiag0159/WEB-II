name: Integración Continua (CI)

on:
  push:
    branches: [ "tp3","main"]
  pull_request:
    branches: [ "tp3","main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar el código
      uses: actions/checkout@v3

    - name: Configurar Java 21
      uses: actions/setup-java@v3
      with:
        java-version: '21' 
        distribution: 'temurin'
        cache: maven

    - name: Dar permisos de ejecución a Maven Wrapper
      run: chmod +x mvnw

    - name: Ejecutar Tests
      run: ./mvnw clean test